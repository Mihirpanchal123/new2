<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokémon Arena</title>
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; background: #87ceeb; color: #1f2937; }
  canvas { display: block; }
  button, select, input { font-family: inherit; }
  .p0 { color: #2563eb; }
  .p1 { color: #dc2626; }
  .hidden { display: none !important; }

  /* Pokémon sprites (positioned over the 3D arena every frame) */
  #stage { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .mon { position: absolute; left: 0; top: 0; transform-origin: 50% 100%; will-change: transform; }
  .mon img { display: block; image-rendering: pixelated; filter: drop-shadow(0 3px 2px rgba(0,0,0,.25)); }

  /* HUD */
  .panel { position: absolute; top: 16px; width: 310px; background: #fffef5; border: 3px solid; border-radius: 14px; padding: 10px 14px; }
  #panel0 { left: 16px; border-color: #2563eb; box-shadow: 0 4px 0 #2563eb; }
  #panel1 { right: 16px; border-color: #dc2626; box-shadow: 0 4px 0 #dc2626; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .pname { font-weight: 800; font-size: 18px; }
  .owner { font-size: 12px; font-weight: 700; opacity: .85; }
  .badge { font-size: 11px; font-weight: 800; color: #fff; padding: 2px 6px; border-radius: 6px; margin-left: 4px; }
  .mega-badge { background: linear-gradient(90deg, #f472b6, #a78bfa, #60a5fa); }
  .hpwrap { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .hplabel { font-size: 12px; font-weight: 800; color: #f59e0b; background: #374151; padding: 1px 5px; border-radius: 5px; }
  .hpbar { flex: 1; height: 10px; background: #4b5563; border-radius: 6px; overflow: hidden; }
  .hpfill { height: 100%; transition: width .5s ease, background .5s; }
  .hptext { text-align: right; font-size: 13px; font-weight: 700; margin-top: 2px; }
  .balls { display: flex; gap: 3px; }
  .ball { width: 12px; height: 12px; border-radius: 50%; background: linear-gradient(#ef4444 50%, #fff 50%); border: 2px solid #374151; }
  .ball.dead { filter: grayscale(1); opacity: .35; }

  #bottom { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(920px, calc(100% - 32px)); }
  #msg { background: #fffef5; border: 4px solid #374151; border-radius: 14px; padding: 14px 18px; font-size: 19px; min-height: 60px; box-shadow: 0 4px 0 #374151; cursor: pointer; }
  #actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }
  #actions:empty, #switches:empty { display: none; }
  #switches { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .mv { border: 3px solid rgba(0,0,0,.35); border-radius: 12px; padding: 9px 14px; color: #fff; font-weight: 800; font-size: 17px; cursor: pointer; text-shadow: 0 1px 2px rgba(0,0,0,.55); display: flex; justify-content: space-between; align-items: center; }
  .mv small { font-weight: 600; font-size: 12px; }
  .mv:hover:not(:disabled) { filter: brightness(1.1); }
  .mv:disabled { opacity: .4; cursor: not-allowed; }
  .sw { border: 2px solid #374151; background: #fff; border-radius: 10px; padding: 6px 10px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .sw img { height: 28px; image-rendering: pixelated; }
  .sw:hover { background: #f3f4f6; }
  .megabtn { border: 3px solid #a78bfa; background: #fff; color: #7c3aed; font-weight: 900; }
  .megabtn.on { background: linear-gradient(90deg, #f472b6, #a78bfa, #60a5fa); color: #fff; }

  /* Record button */
  #recBtn { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); z-index: 50; background: #111827; color: #fff; border: 2px solid #ef4444; border-radius: 999px; padding: 7px 16px; font-weight: 800; cursor: pointer; }
  #recBtn::before { content: ""; display: inline-block; width: 10px; height: 10px; background: #ef4444; border-radius: 50%; margin-right: 7px; }
  #toast { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); background: #111827; color: #fff; padding: 8px 16px; border-radius: 10px; font-weight: 600; z-index: 60; transition: opacity .4s; opacity: 0; pointer-events: none; }

  /* Overlays */
  .overlay { position: absolute; inset: 0; background: rgba(15, 23, 42, .9); color: #fff; z-index: 20; }
  h1.logo { margin: 0; font-size: 34px; letter-spacing: 1px; color: #facc15; text-shadow: 3px 3px 0 #1d4ed8; }

  /* Team builder */
  #builder { display: flex; flex-direction: column; padding: 14px 18px; gap: 10px; }
  .topbar { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .topbar label { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .topbar select, .topbar input[type=number], .tools input, .tools select { background: #1e293b; color: #fff; border: 1px solid #475569; border-radius: 8px; padding: 5px 8px; }
  .topbar input[type=number] { width: 64px; }
  .tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #search { width: 200px; }
  .seg { display: inline-flex; border: 1px solid #475569; border-radius: 8px; overflow: hidden; }
  .seg button { background: #1e293b; color: #cbd5e1; border: none; padding: 6px 12px; font-weight: 800; cursor: pointer; }
  .seg button.on0 { background: #2563eb; color: #fff; }
  .seg button.on1 { background: #dc2626; color: #fff; }
  #dex { flex: 1; min-height: 120px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; align-content: start; padding-right: 4px; }
  .dexcard { background: #1e293b; border: 2px solid #334155; border-radius: 10px; padding: 6px; cursor: pointer; text-align: center; position: relative; }
  .dexcard:hover { border-color: #facc15; }
  .dexcard .spr { height: 64px; display: flex; align-items: flex-end; justify-content: center; }
  .dexcard .spr img { max-height: 64px; max-width: 100%; image-rendering: pixelated; }
  .dexcard .nm { font-weight: 800; font-size: 13px; margin-top: 2px; }
  .dexcard .meta { font-size: 10px; color: #94a3b8; }
  .dexcard .mg { position: absolute; top: 4px; right: 4px; font-size: 9px; font-weight: 900; padding: 1px 4px; border-radius: 4px; }
  .type { display: inline-block; font-size: 10px; font-weight: 800; color: #fff; padding: 1px 6px; border-radius: 5px; margin: 1px; text-shadow: 0 1px 1px rgba(0,0,0,.4); }
  .teams { display: flex; flex-direction: column; gap: 8px; }
  .teamrow { background: #0f172a; border: 2px solid; border-radius: 12px; padding: 8px; }
  .teamrow.t0 { border-color: #2563eb; } .teamrow.t1 { border-color: #dc2626; }
  .teamrow.editing { box-shadow: 0 0 0 3px #facc15; }
  .teamhead { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-weight: 800; }
  .teamhead select { background: #1e293b; color: #fff; border: 1px solid #475569; border-radius: 6px; padding: 3px 6px; }
  .small { background: #334155; color: #fff; border: none; border-radius: 6px; padding: 4px 10px; font-weight: 700; cursor: pointer; }
  .small:hover { background: #475569; }
  .slots { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
  .slot { background: #1e293b; border-radius: 10px; padding: 6px 8px; min-width: 200px; width: 200px; font-size: 12px; position: relative; }
  .slot.empty { display: flex; align-items: center; justify-content: center; color: #64748b; border: 2px dashed #334155; min-height: 150px; background: transparent; }
  .slot .hd { display: flex; align-items: center; gap: 6px; }
  .slot .hd img { height: 40px; image-rendering: pixelated; }
  .slot .x { position: absolute; top: 4px; right: 6px; background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 16px; }
  .slot select, .slot input { width: 100%; background: #0f172a; color: #fff; border: 1px solid #334155; border-radius: 5px; padding: 2px 4px; margin-top: 3px; font-size: 12px; }
  .slot .lvrow { display: flex; gap: 4px; align-items: center; margin-top: 3px; }
  .slot .lvrow input { width: 54px; margin: 0; }
  .evo { background: #065f46; color: #fff; border: none; border-radius: 5px; padding: 2px 6px; font-size: 11px; font-weight: 700; cursor: pointer; margin-top: 3px; margin-right: 3px; }
  .btn { font-size: 18px; font-weight: 800; padding: 10px 30px; border-radius: 12px; border: none; background: #facc15; color: #000; cursor: pointer; box-shadow: 0 4px 0 #a16207; }
  .btn.alt { background: #e2e8f0; box-shadow: 0 4px 0 #64748b; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  /* Intro / end */
  .center { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; }
  .vs { display: flex; align-items: center; gap: 40px; }
  .vsteam { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .vsteam .sprs { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; justify-content: center; max-width: 420px; }
  .vsteam img { height: 72px; image-rendering: pixelated; }
  .vsword { font-size: 64px; font-weight: 900; color: #facc15; text-shadow: 4px 4px 0 #b91c1c; }
  .vsname { font-size: 28px; font-weight: 900; }
</style>
</head>
<body>

<div id="stage"></div>

<div id="hud" class="hidden">
  <div class="panel" id="panel0"></div>
  <div class="panel" id="panel1"></div>
  <div id="bottom">
    <div id="msg"></div>
    <div id="actions"></div>
    <div id="switches"></div>
  </div>
</div>

<button id="recBtn" class="hidden" title="Record (R)">REC</button>
<div id="toast"></div>

<!-- Team builder -->
<div class="overlay" id="builder">
  <div class="topbar">
    <h1 class="logo">POKéMON ARENA</h1>
    <label>Team size <select id="setSize"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select></label>
    <label>Default level <input type="number" id="setLevel" min="1" max="100" value="50"></label>
    <label>Battle speed <select id="setSpeed"><option value="1">Normal</option><option value="0.6">Fast</option><option value="0.35">Turbo</option></select></label>
    <label><input type="checkbox" id="setAuto"> Auto-play next random battle (CPU vs CPU)</label>
    <label><input type="checkbox" id="setMute"> Mute cries</label>
  </div>
  <div class="tools">
    <span style="font-weight:700">Adding to:</span>
    <div class="seg"><button id="edit0" class="on0">Player 1</button><button id="edit1">Player 2</button></div>
    <input id="search" placeholder="Search Pokémon...">
    <select id="typeFilter"><option value="">All types</option></select>
    <label style="font-size:13px"><input type="checkbox" id="megaOnly"> Can Mega Evolve</label>
  </div>
  <div id="dex"></div>
  <div class="teams">
    <div class="teamrow t0" id="team0"></div>
    <div class="teamrow t1" id="team1"></div>
  </div>
  <div style="display:flex; gap:12px; justify-content:center;">
    <button class="btn alt" id="recBtn2" title="Record (R)">⏺ Record</button>
    <button class="btn alt" id="randomBoth">Random Both Teams</button>
    <button class="btn" id="startBtn">Start Battle!</button>
  </div>
</div>

<div class="overlay center hidden" id="intro"></div>

<div class="overlay center hidden" id="endScreen">
  <h1 class="logo" id="endTitle" style="font-size:52px"></h1>
  <div id="endSub" style="font-size:18px;color:#cbd5e1"></div>
  <div style="display:flex; gap:12px;">
    <button class="btn" id="rematchBtn">Rematch</button>
    <button class="btn alt" id="randomBattleBtn">New Random Battle</button>
    <button class="btn alt" id="builderBtn">Team Builder</button>
  </div>
</div>

<script src="data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
