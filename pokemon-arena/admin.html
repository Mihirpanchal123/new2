<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Arena Admin</title>
<style>
  :root { --bg: #0f1220; --card: #181c30; --line: #2a3050; --text: #e8eaf6; --muted: #9aa0c0; --accent: #f0c040; --ok: #4ade80; --bad: #f87171; --soon: #f59e0b; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, 'Segoe UI', sans-serif; padding: 24px 16px 48px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: .02em; } h1 b { color: var(--accent); }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; margin: 0 0 12px; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px 16px; }
  label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); }
  label.check { flex-direction: row; align-items: center; gap: 8px; color: var(--text); font-size: 14px; }
  input[type=text], input[type=password], input[type=number], select { background: #10142a; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; font: inherit; width: 100%; }
  input[type=range] { width: 100%; accent-color: var(--accent); } input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
  button { background: var(--accent); color: #1a1406; border: 0; border-radius: 9px; padding: 10px 18px; font: 600 15px system-ui, sans-serif; cursor: pointer; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .msg { min-height: 20px; font-size: 14px; } .msg.ok { color: var(--ok); } .msg.bad { color: var(--bad); }
  .world { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .world:first-of-type { border-top: 0; padding-top: 0; }
  .world b { font-size: 16px; } .world small { display: block; color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .seg button { background: transparent; color: var(--muted); border-radius: 0; padding: 8px 14px; font-size: 14px; }
  .seg button.on.open { background: var(--ok); color: #06210f; } .seg button.on.soon { background: var(--soon); color: #241500; }
  #login { max-width: 360px; margin: 10vh auto 0; }
  #login label { margin-bottom: 12px; }
  .hidden { display: none !important; }
  .foot { color: var(--muted); font-size: 13px; }
  @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <!-- login -->
  <form class="card" id="login" autocomplete="on">
    <h1>Pokémon Arena <b>Admin</b></h1>
    <p class="sub">Log in to manage the site.</p>
    <label>Username <input type="text" id="user" autocomplete="username" required></label>
    <label>Password <input type="password" id="pass" autocomplete="current-password" required></label>
    <div class="row"><button type="submit" id="loginBtn">Log in</button><span class="msg" id="loginMsg"></span></div>
  </form>

  <!-- the panel -->
  <div id="panel" class="hidden">
    <div class="row" style="justify-content: space-between; margin-bottom: 14px;">
      <div><h1>Pokémon Arena <b>Admin</b></h1><p class="sub" style="margin: 0;">Changes apply to every visitor on their next page load.</p></div>
      <button class="ghost" id="logout" type="button">Log out</button>
    </div>

    <div class="card">
      <h2>Journey worlds</h2>
      <div class="world"><div><b>⭐ Journey</b><small>The Eclipse of Valoria</small></div><div class="seg" data-world="valoria"><button type="button" data-v="open" class="open">Open</button><button type="button" data-v="soon" class="soon">Coming soon</button></div></div>
      <div class="world"><div><b>🏮 Journey II</b><small>The Lost Days of Meridia</small></div><div class="seg" data-world="meridia"><button type="button" data-v="open" class="open">Open</button><button type="button" data-v="soon" class="soon">Coming soon</button></div></div>
    </div>

    <div class="card">
      <h2>Battles</h2>
      <div class="grid">
        <label>Default level <input type="number" data-k="level" min="1" max="100"></label>
        <label>Arena <select data-k="theme"><option value="random">Random</option><option value="stadium">Pokémon Stadium</option><option value="forest">Viridian Forest</option><option value="volcano">Mt. Chimney Crater</option><option value="beach">Sunny Beach</option><option value="icecave">Ice Path Cavern</option><option value="city">Lumiose Night Arena</option></select></label>
        <label>Battle speed <select data-k="speed"><option value="1">Normal</option><option value="0.6">Fast</option><option value="0.35">Turbo</option></select></label>
        <label>Battle length <select data-k="length"><option value="1">Official</option><option value="2">Long (2× HP)</option><option value="3">Epic (3× HP)</option></select></label>
        <label>Random pool <select data-k="pool"><option value="final">Fully evolved</option><option value="any">Any Pokémon</option></select></label>
        <label>⏱ Sudden death <select data-k="sudden"><option value="0">Off</option><option value="30">30 s</option><option value="45">45 s</option><option value="60">60 s</option><option value="90">90 s</option></select></label>
        <label class="check"><input type="checkbox" data-k="auto"> Auto-play next random battle</label>
        <label class="check"><input type="checkbox" data-k="replays"> Final-blow replay</label>
        <label class="check"><input type="checkbox" data-k="flashes"> ⚡ Impact flashes</label>
        <label class="check"><input type="checkbox" data-k="cutins"> 🎬 Cut-ins</label>
      </div>
    </div>

    <div class="card">
      <h2>Sound &amp; screen</h2>
      <div class="grid">
        <label>🎵 Music <input type="range" data-k="music" min="0" max="1" step="0.05"></label>
        <label>🔊 Effects <input type="range" data-k="sfx" min="0" max="1" step="0.05"></label>
        <label class="check"><input type="checkbox" data-k="mute"> Mute cries</label>
        <label class="check"><input type="checkbox" data-k="fps"> Show FPS</label>
        <label class="check"><input type="checkbox" data-k="shorts"> 📱 Shorts mode (9:16)</label>
      </div>
    </div>

    <div class="card">
      <h2>Journey &amp; recording</h2>
      <div class="grid">
        <label class="check"><input type="checkbox" data-k="journeyInfinite"> 💰 Journey: unlimited money &amp; items</label>
        <label>Channel name <input type="text" data-k="channel" maxlength="28" placeholder="your channel name"></label>
      </div>
    </div>

    <div class="row"><button type="button" id="save">Save for everyone</button><span class="msg" id="saveMsg"></span></div>
    <p class="foot" id="updated"></p>
  </div>
</div>
<script>
  'use strict';
  const API = '/api/site-config', KEY = 'arena-admin-token';
  const $ = id => document.getElementById(id);
  // the game's own defaults, shown until something is saved
  const DEFAULTS = { level: 50, theme: 'random', speed: '1', length: '1', pool: 'final', sudden: '60', auto: false, replays: true, flashes: true, cutins: true, music: 0.6, sfx: 0.85, mute: false, fps: true, shorts: false, journeyInfinite: false, channel: '' };
  const fields = [...document.querySelectorAll('[data-k]')];
  const worlds = { valoria: 'open', meridia: 'open' };
  let token = null;
  try { token = sessionStorage.getItem(KEY); } catch (e) {}

  const msg = (el, text, cls) => { el.textContent = text; el.className = 'msg ' + (cls || ''); };
  async function api(method, body) {
    const r = await fetch(API, { method, headers: body ? { 'content-type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
    let j = {}; try { j = await r.json(); } catch (e) {}
    if (r.status === 404 || (!r.ok && !j.error)) throw new Error('The admin API is not running here. Open the site through Netlify or with "node serve.mjs".');
    return { ok: r.ok, status: r.status, j };
  }
  function showWorlds() {
    for (const seg of document.querySelectorAll('.seg')) for (const b of seg.querySelectorAll('button')) b.classList.toggle('on', worlds[seg.dataset.world] === b.dataset.v);
  }
  function fill(cfg) {
    const g = { ...DEFAULTS, ...(cfg.game || {}) };
    for (const el of fields) { const v = g[el.dataset.k]; if (el.type === 'checkbox') el.checked = !!v; else el.value = String(v); }
    Object.assign(worlds, { valoria: 'open', meridia: 'open' }, cfg.journey || {});
    showWorlds();
    $('updated').textContent = cfg.updated ? 'Last saved: ' + new Date(cfg.updated).toLocaleString() : 'Nothing saved yet: visitors get the game\'s defaults.';
  }
  function read() {
    const game = {};
    for (const el of fields) {
      const k = el.dataset.k;
      game[k] = el.type === 'checkbox' ? el.checked : el.type === 'range' ? +el.value : k === 'level' ? Math.max(1, Math.min(100, Math.round(+el.value) || 50)) : el.value;
    }
    return { journey: { ...worlds }, game };
  }
  async function openPanel() {
    $('login').classList.add('hidden'); $('panel').classList.remove('hidden');
    try { fill((await api('GET')).j); } catch (e) { msg($('saveMsg'), e.message, 'bad'); }
  }

  $('login').onsubmit = async e => {
    e.preventDefault();
    $('loginBtn').disabled = true; msg($('loginMsg'), 'Checking...');
    try {
      const r = await api('POST', { user: $('user').value, pass: $('pass').value });
      if (!r.ok) return msg($('loginMsg'), r.j.error || 'Could not log in', 'bad');
      token = r.j.token; try { sessionStorage.setItem(KEY, token); } catch (err) {}
      $('pass').value = ''; msg($('loginMsg'), '');
      openPanel();
    } catch (err) { msg($('loginMsg'), err.message, 'bad'); }
    finally { $('loginBtn').disabled = false; }
  };
  for (const seg of document.querySelectorAll('.seg')) seg.onclick = e => { const b = e.target.closest('button'); if (!b) return; worlds[seg.dataset.world] = b.dataset.v; showWorlds(); };
  $('save').onclick = async () => {
    $('save').disabled = true; msg($('saveMsg'), 'Saving...');
    try {
      const r = await api('POST', { token, config: read() });
      if (r.status === 401) { msg($('saveMsg'), r.j.error, 'bad'); setTimeout(logout, 1500); return; }
      if (!r.ok) return msg($('saveMsg'), r.j.error || 'Could not save', 'bad');
      fill(r.j.config); msg($('saveMsg'), 'Saved. Visitors get it on their next page load.', 'ok');
    } catch (err) { msg($('saveMsg'), err.message, 'bad'); }
    finally { $('save').disabled = false; }
  };
  function logout() { token = null; try { sessionStorage.removeItem(KEY); } catch (e) {} $('panel').classList.add('hidden'); $('login').classList.remove('hidden'); }
  $('logout').onclick = logout;
  if (token) openPanel();
</script>
</body>
</html>
